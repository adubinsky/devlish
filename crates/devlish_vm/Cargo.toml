[package]
name = "devlish-vm"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Platform-independent Devlish bytecode virtual machine"

[lib]
name = "devlish_vm"
path = "src/lib.rs"

[dependencies]
# Evidence hashes must survive serialize/parse without changing fractional values.
serde_json = { version = "=1.0.150", features = ["float_roundtrip"] }
regex = "=1.11.1"
rust_decimal = "=1.36.0"
