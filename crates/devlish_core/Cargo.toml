[package]
name = "devlish-core"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Native Rust parser and bytecode compiler core for Devlish"

[lib]
name = "devlish_core"
path = "src/lib.rs"

[[bin]]
name = "devlish-core"
path = "src/main.rs"

[dependencies]
devlish-audit = { path = "../devlish_audit" }
devlish-vm = { path = "../devlish_vm" }
devlish-llm = { path = "../devlish_llm", optional = true }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
ureq = { version = "2.12", optional = true }
calamine = { version = "0.26", optional = true }
glob = "0.3"
libc = "0.2"
tiny_http = { version = "0.12", optional = true }

[features]
default = ["native"]
native = ["ureq", "calamine", "devlish-llm", "tiny_http"]

[dev-dependencies]
ring = "=0.17.14"
