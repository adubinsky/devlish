[package]
name = "devlish-llm"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Outbound LLM provider adapters for the Devlish harness"

[lib]
name = "devlish_llm"
path = "src/lib.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
ureq = { version = "2.12", features = ["json"] }
toml = "0.8"
